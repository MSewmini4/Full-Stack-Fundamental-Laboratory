<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">

        <title>My To Do List</title>

        <link 
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

            <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <nav class="navbar navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand fw-bold" href="#">
                    My To Do List
                </a>
            </div>
        </nav>

        <main class="container py-5">
            <div class="todo-card mx-auto">
                <h1 class="text-center mb-2"">My Tasks</h1>
                <p class="text-center text-muted mb-4">
                    Organize your day,one task at a time.
                </p>

                <form id="taskForm" class="mb-3">
                    <div class="input-group">
                        <input
                            type="text"
                            class="form-control"
                            placeholder="Add a new task..."
                            id="taskInput"
                            aria-label="New task"
                        >
                        <button class="btn btn-primary" type="submit">
                            Add Task
                        </button>
                    </div>

                    <p id="errorMessage" class="text-danger mt-2 mb-0" role="alert"></p>
                    
                </form>

                <div class="d-flex justify-content-between align-items-center-mb-3">
                    <span class=""fw-semibold">Your Tasks</span>
                    <span id="taskCounter" class="badge bg-primary">
                        0 tasks left
                    </span>
                </div>

                <div class="filter-buttons d-flex flex-wrap gap-2 mb-3"">
                      <button type="button"
                              class="btn btn-primary filter-btn"
                              data-filter="all">
                          ALL
                      </button>
                      <button type="button"
                              class="btn btn-outline-primary filter-btn"
                              data-filter="active">
                              ACTIVE
                           
                      </button>
                      <button type="button"
                              class="btn btn-outline-primary filter-btn"
                              data-filter="completed">
                          COMPLETED
                      </button>
                  </div>

                  

                <ul id="taskList" class="list-group mb-3">
                </ul>

                  <p id="emptyMessage" class="text-center text-muted py-3">
                        No tasks yet. Add your first task!</p>
     
                  <button type="button"   
                       id="clearCompleted"
                       class="btn btn-outline-danger w-100">
                    clear completed tasks
                </button>   
                  </div>
        </main>

        <footer class="text-center py-3">
            <p class="mb-0 text-muted">
                My To Do List | Full Stack Development Practical
            </p>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
